# Configuración SOLO para las pruebas: base H2 en memoria, no se necesita Docker ni PostgreSQL.
spring.datasource.url=jdbc:h2:mem:ferretech;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=clave-de-pruebas-clave-de-pruebas-1234567890
app.jwt.expiracion=1h
app.cors.origins=*
app.seed.habilitado=true
app.seed.password-cliente=1234
app.seed.password-admin=1234
app.recuperacion.mostrar-codigo=true
