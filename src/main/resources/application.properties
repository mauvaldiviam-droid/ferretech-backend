spring.application.name=ferretech-api
server.port=8080

# Base de datos (en Docker llegan por variables de entorno desde compose.yaml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ferretech}
spring.datasource.username=${DB_USER:ferretech}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seguridad
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiracion=8h
app.cors.origins=${APP_CORS_ORIGINS:*}

# Datos iniciales (cuentas de prueba y 3 productos si la base está vacía)
app.seed.habilitado=true
app.seed.password-cliente=${APP_SEED_PASSWORD_CLIENTE:1234}
app.seed.password-admin=${APP_SEED_PASSWORD_ADMIN:1234}

# Recuperación de contraseña: true muestra el código en la respuesta (simula el correo)
app.recuperacion.mostrar-codigo=${APP_RECUPERACION_MOSTRAR_CODIGO:true}
