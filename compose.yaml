# Tres contenedores en la misma EC2:
#   caddy   -> única entrada pública (80/443): sirve el frontend y reenvía /api al backend
#   backend -> API Spring Boot (solo accesible desde caddy y desde la propia máquina)
#   db      -> PostgreSQL con volumen persistente
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ferretech}
      POSTGRES_USER: ${POSTGRES_USER:-ferretech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: .
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ferretech}
      DB_USER: ${POSTGRES_USER:-ferretech}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Define APP_JWT_SECRET (mínimo 32 caracteres) en el archivo .env}
      APP_CORS_ORIGINS: "${APP_CORS_ORIGINS:-*}"
      APP_SEED_PASSWORD_CLIENTE: ${APP_SEED_PASSWORD_CLIENTE:-1234}
      APP_SEED_PASSWORD_ADMIN: ${APP_SEED_PASSWORD_ADMIN:-1234}
      APP_RECUPERACION_MOSTRAR_CODIGO: ${APP_RECUPERACION_MOSTRAR_CODIGO:-true}
    ports:
      # Solo en loopback: sirve para probar con curl desde la propia EC2 o desde tu PC
      # (npm run dev). No queda expuesto a Internet.
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
